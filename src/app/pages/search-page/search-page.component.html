@if (profiles(); as profiles) {
  <tt-profile-filters></tt-profile-filters>

  <div class="profile-card__wrapper">
    @for (profile of profiles; track profile.id) {
      <tt-profile-card
        [profile]="profile"
        (subscribe)="handleSubscribe($event)"
      ></tt-profile-card>
    }
  </div>
} @else {
  <p>Профилей нету...</p>
}
