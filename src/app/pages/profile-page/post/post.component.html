@if (post(); as post) {
  <tt-user-avatar [avatarUrl]="post.author.avatarUrl"> </tt-user-avatar>

  <main class="post-body">
    <div class="post-header">
      <strong class="post__author">
        {{ post.author.firstName }}
        {{ post.author.lastName }}
        <span class="post-created-at">
          {{post.createdAt | date: 'HH:mm dd.MM.YY'}}
        </span>
      </strong>
    </div>
    <p class="medium-text">{{post.content}}</p>

    <div class="post-counters">
      <div class="post-comments">
        <svg class="svg16" icon="comments"></svg>
        <span class="post-count">{{comment().length}}</span>
      </div>
      <div class="post-likes">
        <svg class="svg16" icon="like"></svg>
        <span class="like-count">{{post.likes}}</span>
      </div>
    </div>

    <div class="post__comments-wrapper">
      @for (comment of comment(); track comment.id) {
        <tt-comment
          [comment]="comment"
        ></tt-comment>
      }
    </div>

    <tt-post-input
      (created)="onCreated()"
      [postId]="post.id"
      [isCommentInput]="true"
    ></tt-post-input>
  </main>
}
